[theme]
# Smart City Cartagena — tema claro coherente con el dashboard
primaryColor = "#1F48B8"
backgroundColor = "#FCFCFD"
secondaryBackgroundColor = "#F6F6F8"
textColor = "#111113"
font = "sans serif"
base = "light"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
