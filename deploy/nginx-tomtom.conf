# Reverse proxy publico. Streamlit debe escuchar solo en 127.0.0.1:8501.
server {
    listen 80;
    listen [::]:80;
    server_name tomtom-utb.duckdns.org;

    if ($host != tomtom-utb.duckdns.org) { return 444; }
    return 301 https://tomtom-utb.duckdns.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tomtom-utb.duckdns.org;

    if ($host != tomtom-utb.duckdns.org) { return 444; }

    ssl_certificate /etc/letsencrypt/live/tomtom-utb.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomtom-utb.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Streamlit custom components (for example streamlit-folium) render in
    # same-origin iframes. Keep cross-origin framing blocked without breaking
    # those components.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Streamlit utiliza WebSocket para mantener la sesion.
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # Compatible con Nginx 1.18 de Ubuntu: añade Secure a las cookies que
        # Streamlit entrega con Path=/. Streamlit ya establece SameSite=Lax.
        proxy_cookie_path / "/; Secure";
    }
}
