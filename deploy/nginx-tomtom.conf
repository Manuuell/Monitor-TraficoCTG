# Reverse proxy publico. Streamlit debe escuchar solo en 127.0.0.1:8501.
# El dominio principal es smartcity.sentralabs.co; tomtom-utb.duckdns.org se
# mantiene. Cada uno tiene su certificado: si DuckDNS falla al renovar, el
# de sentralabs.co no se cae con el. Lo comun esta en dashboard-trafico.conf.
server {
    listen 80;
    listen [::]:80;
    server_name smartcity.sentralabs.co tomtom-utb.duckdns.org;

    if ($host !~ ^(smartcity\.sentralabs\.co|tomtom-utb\.duckdns\.org)$) { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartcity.sentralabs.co;

    if ($host != smartcity.sentralabs.co) { return 444; }

    ssl_certificate /etc/letsencrypt/live/smartcity.sentralabs.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartcity.sentralabs.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/dashboard-trafico.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tomtom-utb.duckdns.org;

    if ($host != tomtom-utb.duckdns.org) { return 444; }

    ssl_certificate /etc/letsencrypt/live/tomtom-utb.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomtom-utb.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/dashboard-trafico.conf;
}
