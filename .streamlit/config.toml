[global]
# La barra de horas (select_slider) necesita `value` para ser de rango y a la
# vez la manejan las franjas por session_state: sin esto Streamlit muestra un
# aviso amarillo la primera vez.
disableWidgetStateDuplicationWarning = true

[theme]
# Smart City Cartagena — tema claro coherente con el dashboard
primaryColor = "#1F48B8"
backgroundColor = "#FCFCFD"
secondaryBackgroundColor = "#F6F6F8"
textColor = "#111113"
font = "sans serif"
base = "light"

[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
corsAllowedOrigins = ["https://tomtom-utb.duckdns.org"]

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "type"
toolbarMode = "minimal"
